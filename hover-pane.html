<!doctype html>
<!--
  Hover Panel UI: In-page overlay for mobile UX.
  Loaded in iframe by page.ts. Mirrors popup.html structure.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Streamonio Hover Panel</title>
    <link rel="stylesheet" href="shared-pane.css" />
    <style>
      /* Hover-specific overrides */
      :root {
        font-size: 16px;
      }

      body {
        width: 100%;
        height: 100vh;
      }

      .content {
        padding-bottom: 0;
        gap: 0.5rem;
      }

      .endpoint-select {
        padding: 0.375rem;
        border: 1px solid #ddd;
        border-radius: 0.25rem;
        font-size: 11px;
        min-width: 120px;
        cursor: pointer;
        background: #fff;
      }

      /* Hover-specific responsive overrides
       * NOTE: Matches popup overrides to ensure identical layout on mobile.
       * Hover typically doesn't trigger @media (max-width: 450px) since it's
       * full-width, but these rules ensure consistency if viewed on small screens.
       */
      @media (max-width: 450px) {
        /* Override mobile padding reduction - keep desktop 1rem */
        .content {
          padding: 1rem;
          padding-bottom: 0;
        }

        /* Override mobile status-bar padding reduction - keep desktop spacing */
        .status-bar-card {
          padding: 0.5rem 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>
        🎵 <em>Streamonio</em>
        <sub id="hover-version" style="color: #999; font-size: 0.5em; font-style: normal">…</sub>
      </h1>
      <p>Send page streams to API calls</p>
    </div>

    <div class="content">
      <div id="loading" class="loading">
        <p>Loading...</p>
      </div>

      <div id="status" class="status" style="display: none">
        <div class="status-title">
          <span>Streams on this page:</span>
          <span class="badge" id="stream-count">0</span>
        </div>
      </div>

      <div class="button-group">
        <button id="refresh-btn" class="btn-secondary">🔄 Refresh</button>
        <button id="options-btn" class="btn-secondary">⚙️ Options</button>
      </div>

      <div id="streams-list-container" class="streams-list-container" style="display: none">
        <div id="streams-list" class="streams-list"></div>
      </div>

      <div id="stream-panel" class="stream-panel" style="display: none">
        <div id="panel-actions" class="stream-actions"></div>
      </div>

      <div id="empty-state" class="empty-state" style="display: none">
        <div class="empty-state-icon">🔍</div>
        <p><strong>No streams detected</strong></p>
        <p style="font-size: 0.75rem; margin-top: 0.5rem">
          Endpoints can still use page URL/title. Name those endpoints accordingly.
        </p>
      </div>

      <div id="log-filter-panel" class="log-filter-panel">
        <label
          ><input type="checkbox" class="log-level-filter" value="error" checked /> Error</label
        >
        <label><input type="checkbox" class="log-level-filter" value="warn" checked /> Warn</label>
        <label><input type="checkbox" class="log-level-filter" value="info" checked /> Info</label>
        <label
          ><input type="checkbox" class="log-level-filter" value="debug" checked /> Debug</label
        >
      </div>
      <div id="log-viewer" class="log-viewer"></div>
    </div>

    <div id="status-bar" class="status-bar-card">
      <div class="status-content">
        <span id="status-message" class="status-text"></span>
      </div>
    </div>

    <script src="hover-pane.js" type="module"></script>
  </body>
</html>
