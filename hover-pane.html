<!doctype html>
<!--
  Hover Panel UI: In-page overlay for mobile UX.
  Loaded in iframe by page.ts. Mirrors popup.html structure.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Streamonio Hover Panel</title>
    <link rel="stylesheet" href="shared-pane.css" />
    <style>
      /* Hover-specific overrides */
      html {
        font-size: 100% !important; /* Reset to browser default, isolate from page */
      }

      body {
        font-size: 0.875rem !important; /* 14px at 16px base */
      }

      :root {
        --phi: 1.618;
      }

      body {
        width: 100%;
        height: 100vh;
      }

      .content {
        padding-bottom: 0;
        gap: 0.125rem;
      }

      /* Golden ratio heights for desktop hover */
      @media (min-width: 451px) {
        .streams-scrollp {
          max-height: 12rem; /* base */
        }

        .endps-scrollp {
          max-height: calc(12rem * 1.618); /* φ × streams ≈ 19.4rem */
        }

        #log-viewer {
          /* φ × (streams + endps + btns) where btns ≈ 3rem */
          max-height: calc((12rem + 19.4rem + 3rem) * 1.618); /* ≈ 55.6rem */
        }
      }

      /* Hover-specific responsive overrides
       * NOTE: Matches popup overrides to ensure identical layout on mobile.
       * Hover typically doesn't trigger @media (max-width: 450px) since it's
       * full-width, but these rules ensure consistency if viewed on small screens.
       */
      @media (max-width: 450px) {
        /* Override mobile padding reduction - keep desktop 1rem */
        .content {
          padding: 1rem;
          padding-bottom: 0;
        }

        /* Override mobile status-bar padding reduction - keep desktop spacing */
        .status-bar-card {
          padding: 0.5rem 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-content">
        <div class="header-main">
          <h1>
            🎵 <em>Streamonio</em>
            <sub id="hover-version" style="color: #999; font-size: 0.5em; font-style: normal"
              >…</sub
            >
          </h1>
          <p>Send page streams to API calls</p>
        </div>
        <button id="options-btn" class="header-icon-btn" title="Options">⚙️</button>
      </div>
    </div>

    <div class="content">
      <div id="loading" class="loading">
        <p>Loading...</p>
      </div>

      <div id="status" class="status" style="display: none">
        <div class="status-title">
          <span class="badge" id="stream-count">0</span><span> streams, </span
          ><span class="badge" id="endpoint-count">0</span><span> endpoints</span>
          <button id="refresh-btn" class="status-banner-icon-btn" title="Refresh">🔄</button>
        </div>
      </div>

      <div id="streams-scrollp" class="streams-scrollp">
        <div id="streams" class="streams"></div>
        <div class="list-placeholder">Detected media streams will appear here</div>
      </div>

      <div id="endps-scrollp" class="endps-scrollp">
        <div id="endps" class="endps"></div>
        <div class="list-placeholder">API endpoints will appear here (configure in Options)</div>
      </div>

      <div id="btns" class="btns"></div>

      <div id="empty-state" class="empty-state" style="display: none">
        <div class="empty-state-icon">🔍</div>
        <p><strong>No streams detected</strong></p>
        <p style="font-size: 0.75rem; margin-top: 0.5rem">
          Endpoints can still use page URL/title. Name those endpoints accordingly.
        </p>
      </div>

      <!-- Log Viewer with integrated filters -->
      <div id="log-viewer" class="log-viewer"></div>
    </div>

    <div id="status-bar" class="status-bar-card">
      <div class="status-content">
        <span id="status-message" class="status-text"></span>
      </div>
    </div>

    <script src="hover-pane.js" type="module"></script>
  </body>
</html>
